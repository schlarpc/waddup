[package]
name = "waddup-decomposed-script"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "waddup-decomposed"
path = "src/main.rs"

[dependencies]
sp1-sdk = { path = "../../crates/sdk", features = ["blocking", "profiling", "experimental"] }
sha2 = { version = "0.10", features = ["compress"] }
blake3 = "1.5"
hex = "0.4"

[build-dependencies]
sp1-build = { path = "../../crates/build" }
